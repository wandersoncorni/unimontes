
services:
  mysql:
    image: mysql:8.0
    container_name: ojs-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-redo-log-capacity=1G
      - --innodb-buffer-pool-size=512M

    volumes:
      - ./data/mysql:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - ojs-unimotes
    
    ports:
      - "${MYSQL_PORT}:3306"

  ojs:
    image: pkpofficial/ojs:${OJS_VERSION}
    container_name: ojs-app
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "${HTTP_PORT}:80"

    environment:
      OJS_DB_HOST: mysql
      OJS_DB_NAME: ${MYSQL_DATABASE}
      OJS_DB_USER: ${MYSQL_USER}
      OJS_DB_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./data/files:/var/www/files

    networks:
      - ojs-unimotes

networks:
  ojs-unimotes:
    driver: bridge
